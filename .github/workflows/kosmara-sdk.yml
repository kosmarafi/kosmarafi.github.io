name: Kosmara SDK
on:
  push:
    branches: [main]
    paths:
      - "kosmara-sdk/**"
      - ".github/workflows/kosmara-sdk.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kosmara-sdk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar
        working-directory: kosmara-sdk
        run: |
          mkdir -p ../sdk
          ( npm install && npm run build ) > ../sdk/build-log.txt 2>&1 && echo "BUILD OK" >> ../sdk/build-log.txt || echo "BUILD FAILED" >> ../sdk/build-log.txt
          tail -n 80 ../sdk/build-log.txt > ../sdk/build-log.tmp && mv ../sdk/build-log.tmp ../sdk/build-log.txt
          {
            echo "== api"
            grep -n -B2 -A14 -E "declare function (closePositionInstructions|harvestPositionInstructions|decreaseLiquidityInstructions|fetchPositionsForOwner)\b|type (ClosePositionInstructions|HarvestPositionInstructions|DecreaseLiquidityInstructions)\b" node_modules/@orca-so/whirlpools/dist/index.d.ts | head -n 200 || true
            echo "== core quotes"
            grep -rn -A8 -E "(type|interface) (CollectFeesQuote|CollectRewardsQuote|CollectRewardQuote)\b" node_modules/@orca-so/whirlpools-core/dist/ --include=*.d.ts | head -n 60 || true
            echo "== raydium"
            node --input-type=module -e "import * as R from '@raydium-io/raydium-sdk-v2'; console.log(Object.keys(R).filter(k=>/tick|pool|math|clmm|txversion/i.test(k)).join(' '))" 2>&1 | head -c 3000 || true
            echo
            for f in $(grep -rlE "static getPriceAndTick|static getLiquidityAmountOutFromAmountIn" node_modules/@raydium-io/raydium-sdk-v2/lib --include=*.d.ts | head -4); do echo "-- $f"; grep -nE "^declare class|static getPriceAndTick|static getLiquidityAmountOutFromAmountIn|static getTickPrice|static priceToTick" $f | head -12; done
            echo "== orca meta"
            curl -s https://api.orca.so/v2/solana/pools/Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE | head -c 5000
            echo "== whirlpool fields"
            grep -n -A30 -E "^type Whirlpool = " node_modules/@orca-so/whirlpools-client/dist/index.d.ts | cut -c1-160 || true
          } > ../sdk/api.txt 2>&1
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk
          git commit -m "Compilar SDK de Kosmara" || exit 0
          git pull --rebase origin main
          git push
