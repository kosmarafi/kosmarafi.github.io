name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 75
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch();const pg=await b.newPage();
          await pg.goto('https://kosmarafi.github.io/?v='+Date.now());await pg.waitForFunction(()=>window.solanaWeb3,null,{timeout:60000});
          const ok=await pg.evaluate(()=>document.documentElement.innerHTML.includes('leída a mano'));console.log("NEWCODE",ok);
          const r=await pg.evaluate(async()=>{const W=solanaWeb3,out={};const PK="9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM";
           const H={"x-api-key":"jup_pub_fc0db5fe4cd24284045be587a267338b6e067d0f97e76712fbf9692bd3830f69"},RPC="https://mainnet.helius-rpc.com/?api-key=d69a3929-b7b3-4523-8dea-9d82a0bcfd36";
           const rc=async(m,p)=>{const j=await (await fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:m,params:p})})).json();if(j.error)throw new Error(JSON.stringify(j.error));return j.result};
           const b64u=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
           try{
           const q=await (await fetch("https://api.jup.ag/swap/v1/quote?inputMint=So11111111111111111111111111111111111111112&outputMint=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v&amount=10000000&slippageBps=100&dexes=Raydium,Raydium%20CLMM,Raydium%20CP",{headers:H})).json();
           const si=await (await fetch("https://api.jup.ag/swap/v1/swap-instructions",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({quoteResponse:q,userPublicKey:PK,dynamicComputeUnitLimit:true,dynamicSlippage:false})})).json();
           const jIx=ix=>new W.TransactionInstruction({programId:new W.PublicKey(ix.programId),keys:ix.accounts.map(a=>({pubkey:new W.PublicKey(a.pubkey),isSigner:a.isSigner,isWritable:a.isWritable})),data:b64u(ix.data)});
           const ixs=[...(si.computeBudgetInstructions||[]).map(jIx),...(si.setupInstructions||[]).map(jIx),jIx(si.swapInstruction),...(si.cleanupInstruction?[jIx(si.cleanupInstruction)]:[]),...(si.otherInstructions||[]).map(jIx)];
           const d=new Uint8Array(12),dv=new DataView(d.buffer);dv.setUint32(0,2,true);dv.setBigUint64(4,20000n,true);
           ixs.push(new W.TransactionInstruction({programId:W.SystemProgram.programId,keys:[{pubkey:new W.PublicKey(PK),isSigner:true,isWritable:true},{pubkey:new W.PublicKey("7ZeR8DKhdDDXsYHk5oBWPvf9edAzF6cvaJBmuJsry9Uw"),isSigner:false,isWritable:true}],data:d}));
           const alts=[];for(const a of si.addressLookupTableAddresses||[]){const v=(await rc("getAccountInfo",[a,{encoding:"base64"}])).value;const raw=b64u(v.data[0]),ad=[];for(let o=56;o+32<=raw.length;o+=32)ad.push(new W.PublicKey(raw.slice(o,o+32)));alts.push(new W.AddressLookupTableAccount({key:new W.PublicKey(a),state:{deactivationSlot:BigInt("18446744073709551615"),lastExtendedSlot:0,lastExtendedSlotStartIndex:0,authority:undefined,addresses:ad}}))}
           const bh=await rc("getLatestBlockhash",[{commitment:"confirmed"}]);
           const tx=new W.VersionedTransaction(new W.TransactionMessage({payerKey:new W.PublicKey(PK),recentBlockhash:bh.value.blockhash,instructions:ixs}).compileToV0Message(alts));
           const ser=tx.serialize();out.bytes=ser.length;out.alts=alts.length;let bin="";ser.forEach(x=>bin+=String.fromCharCode(x));
           const sim=await rc("simulateTransaction",[btoa(bin),{encoding:"base64",sigVerify:false,replaceRecentBlockhash:true}]);out.err=sim.value.err;out.logs=(sim.value.logs||[]).slice(-3);
           }catch(e){out.ex=e.message}
           return out});
          console.log("RESULT",JSON.stringify(r));await b.close();
          JS
          node t.mjs
