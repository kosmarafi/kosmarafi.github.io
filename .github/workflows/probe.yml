name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch();const pg=await b.newPage();
          await pg.goto('https://kosmarafi.github.io/?v='+Date.now());await pg.waitForFunction(()=>window.solanaWeb3,null,{timeout:60000});
          const r=await pg.evaluate(async()=>{const W=solanaWeb3,out={};const pk=W.Keypair.generate().publicKey,to=new W.PublicKey("7ZeR8DKhdDDXsYHk5oBWPvf9edAzF6cvaJBmuJsry9Uw");
            try{W.SystemProgram.transfer({fromPubkey:pk,toPubkey:to,lamports:20000});out.old="ok"}catch(e){out.old="ERR "+e.message}
            try{const d=new Uint8Array(12),dv=new DataView(d.buffer);dv.setUint32(0,2,true);dv.setBigUint64(4,20000n,true);
              const ix=new W.TransactionInstruction({programId:W.SystemProgram.programId,keys:[{pubkey:pk,isSigner:true,isWritable:true},{pubkey:to,isSigner:false,isWritable:true}],data:d});
              const ref=W.SystemProgram;const m=new W.TransactionMessage({payerKey:pk,recentBlockhash:W.Keypair.generate().publicKey.toBase58(),instructions:[ix]}).compileToV0Message([]);
              const tx=new W.VersionedTransaction(m);out.newTx=tx.serialize().length;out.data=Array.from(tx.message.compiledInstructions[0].data).join(",")}catch(e){out.newErr=e.message}
            return out});
          console.log("RESULT",JSON.stringify(r));await b.close();
          JS
          node t.mjs
