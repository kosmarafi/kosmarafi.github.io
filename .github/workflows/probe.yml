name: probe
on: { push: { paths: [".github/probe.mjs",".github/workflows/probe.yml"] }, workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/probe.mjs
