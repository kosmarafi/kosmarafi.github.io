name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 20
          for u in "" i18n/en.json sdk/kz-sdk.js manifest.webmanifest sw.js icons/icon-192.png; do echo "PAGE $u $(curl -s -o /dev/null -w '%{http_code}' https://kosmarafi.github.io/$u)"; done
          O="Origin: https://kosmarafi.github.io"
          echo "HELIUS $(curl -s -X POST 'https://mainnet.helius-rpc.com/?api-key=d69a3929-b7b3-4523-8dea-9d82a0bcfd36' -H "$O" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getSlot"}' | head -c 150)"
          echo "JUP $(curl -s -o /dev/null -w '%{http_code}' -H "$O" -H 'x-api-key: jup_pub_fc0db5fe4cd24284045be587a267338b6e067d0f97e76712fbf9692bd3830f69' 'https://api.jup.ag/swap/v1/quote?inputMint=So11111111111111111111111111111111111111112&outputMint=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v&amount=1000000')"
          curl -s -D - -o /dev/null -X OPTIONS -H "$O" -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: x-api-key' 'https://api.jup.ag/swap/v1/quote' | grep -i 'access-control-allow-origin' | sed 's/^/JUPCORS /'
