name: probe
on: [push]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: sleep 70 && node .github/probe.mjs
      - run: for f in a b; do echo "== $f"; python3 -c "import base64;print(base64.b64encode(open('$f.png','rb').read()).decode())" | fold -w 4000; done
