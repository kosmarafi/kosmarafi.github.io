name: probe
on: [push]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: sleep 75 && node .github/probe.mjs
      - run: base64 -w0 shot.png | fold -w 4000
