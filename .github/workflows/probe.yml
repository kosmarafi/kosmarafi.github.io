name: probe
on: { push: { paths: [".github/probe.mjs",".github/workflows/probe.yml"] }, workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: |
          anvil --fork-url https://base-rpc.publicnode.com --port 8545 --silent &
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 8
          node .github/probe.mjs
